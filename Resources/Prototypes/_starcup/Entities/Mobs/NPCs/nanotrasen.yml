## Five Points Armory
- type: entity
  parent: MobHumanoidNPCHostile
  id: MobFPAHenchmanBase
  name: FPA enforcer
  suffix: Telebaton, hostile
  description: A low-rate NanoTrasen toadie. Probably wouldn't be missed in this sector.
  abstract: true
  components:
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: Loadout
    prototypes:
    - FPAHenchmanGearMelee

- type: entity
  parent: MobFPAHenchmanBase
  id: MobFPAHenchmanRanged
  suffix: Pistol, hostile
  abstract: true
  components:
  - type: Loadout
    prototypes:
    - FPAHenchmanGearRanged

- type: entity
  parent: MobHumanoidNPCHostile
  id: MobFPATrooperBase
  name: FPA trooper
  suffix: Carabinier, hostile
  description: Five Points Armory's main investment and infrastructure reclamation solution.
  abstract: true
  components:
    - type: NpcFactionMember
      factions:
        - Syndicate
    - type: Loadout
      prototypes:
        - FPATrooperCarabinierGear

- type: entity
  parent: MobFPATrooperBase
  id: MobFPAShotgunnerBase
  suffix: Shotgunner, hostile
  abstract: true
  components:
  - type: Loadout
    prototypes:
    - FPATrooperShotgunnerGear

- type: entity
  parent: MobFPATrooperBase
  id: MobFPAShieldbearerBase
  suffix: Shieldbearer, hostile
  abstract: true
  components:
  - type: Loadout
    prototypes:
    - FPATrooperShieldbearerGear

- type: entity
  parent: MobFPATrooperBase
  id: MobFPAPilotBase
  name: FPA shuttle pilot
  description: Swaggering daredevils whose main cargo is oppression in stylish blue.
  abstract: true
  components:
  - type: Loadout
    prototypes:
    - FPAPilotGear

- type: entity
  parent: MobFPATrooperBase
  id: MobFPACaptainBase
  name: FPA captain
  description: The captain of a Five Points Armory vessel. A real big shot, or so they think.
  abstract: true
  components:
  - type: Loadout
    prototypes:
    - FPACaptainGear

