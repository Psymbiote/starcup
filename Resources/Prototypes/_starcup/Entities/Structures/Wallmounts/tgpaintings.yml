# All names were changed from "painting", with the exception of FramedPaintingDebug
- type: entity
  parent: BaseSign
  id: FramedPaintingDebug
  name: painting
  description: An onerously familiar painting.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _starcup/Structures/Wallmounts/Framed/tgpaintings.rsi
    state: debug
  - type: DisassembleOnAltVerb
    prototypeToSpawn: PaintingCurtainedDebug
    disassembleTime: 3

