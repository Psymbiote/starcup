# Five Points Armory
- type: entity
  parent: MarkerBaseStarcup
  id: SpawnMobFPAHenchman
  name: FPA enforcer spawner
  suffix: Melee, hostile
  components:
  - type: Sprite
    layers:
    - state: shadowgreen
    - state: green
    - sprite: Mobs/Species/Human/parts.rsi
      state: full
    - sprite: Clothing/Shoes/Boots/combatboots.rsi
      state: equipped-FEET
    - sprite: Clothing/Uniforms/Jumpsuit/nanotrasen.rsi
      state: equipped-INNERCLOTHING
    - sprite: _DEN/Clothing/OuterClothing/WinterCoats/corpo_jacket_five_points_armory.rsi
      state: equipped-OUTERCLOTHING
    - sprite: Clothing/Hands/Gloves/fingerless.rsi
      state: equipped-HAND
    - sprite: _DEN/Clothing/Eyes/Glasses/sunglasses_big.rsi
      state: equipped-EYES
    - sprite: Clothing/Head/Soft/bluesoft.rsi
      state: equipped-HELMET
    - sprite: _starcup/Clothing/Ears/Headsets/nanotrasen.rsi
      state: alt-equipped-EARS
    - sprite: _DEN/Objects/Weapons/Melee/telebaton.rsi
      state: inhand-right-baton
    - state: ai
  - type: ConditionalSpawner
    prototypes:
    - MobFPAHenchmanHuman
    - MobFPAHenchmanVulpkanin
    - MobFPAHenchmanDoptera
    - MobFPAHenchmanSlimePerson
    - MobFPAHenchmanUnathi

