- type: entity
  id: TelescopicBaton
  parent: [ BaseItem, BaseSecurityContraband, BaseExaminableClothing ]
  name: telescopic baton
  description: A compact personal defense weapon. Sturdy enough to knock the feet out from under attackers.
  components:
  - type: Sprite
    sprite: _DEN/Objects/Weapons/Melee/telebaton.rsi
    layers:
    - state: icon-off
    - state: icon
      visible: false
      map: [ "baton" ]
  - type: Item
    size: Small
  - type: ItemToggle
    soundActivate:
      path: /Audio/_starcup/Weapons/telescopicon.ogg
     #params:
        #volume: -2
    soundDeactivate:
      path: /Audio/_starcup/Weapons/telescopicoff.ogg
  - type: ComponentToggler
    components:
    - type: DisarmMalus
      malus: 0.6
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/_starcup/Weapons/telescopichit.ogg
      params:
        variation: 0.125
    activatedDamage:
      types:
        Blunt: 7
  - type: ItemToggleSize
    activatedSize: Normal
  - type: UseDelay
    delay: 2
  - type: MeleeWeapon
    wideAnimationRotation: -135
    bluntStaminaDamageFactor: 1.5
    damage:
      types:
        Blunt: 1
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: baton
    inhandVisuals:
      left:
      - state: inhand-left-baton
      right:
      - state: inhand-right-baton
  - type: ExaminableClothing
    examineText: clothing-telescopic-baton
